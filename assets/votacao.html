<!DOCTYPE html>
<html style="width: 100%;height: 100%;min-width: 100%;max-width: 100%;min-height: 100%;max-height: 100%;">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Votação</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alfa+Slab+One&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato&amp;display=swap">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.min.css">

    <link rel="stylesheet" href="css/Google-Style-Text-Input.css">
    <link rel="stylesheet" href="css/Search-Input-Responsive-with-Icon.css">
    <link rel="stylesheet" href="css/Studious-selectbox.css">
    <link rel="stylesheet" href="css/untitled.css">

</head>

<body style="width: 100%;height: 100%;min-width: 100%;max-width: 100%;min-height: 100%;max-height: 100%;"
    onload="auth()">

    <div class="container text-start"
        style="margin-top: 30% !important;height: 100%;width: 100%;padding: 0px;margin: 0px;min-width: 100%;max-width: 100%;min-height: 100%;max-height: 100%;display: block;grid-template-rows: 50% 50%;">
        <h1 class="text-center">O presidente ainda não colocou nada em pauta, aguarde.</h1>
    </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Studious-selectbox.js"></script>
    <script src="js/theme.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"
        integrity="sha512-3j3VU6WC5rPQB4Ld1jnLV7Kd5xr+cq9avvhwqzbH/taCRNURoeEpoPBK9pDyeukwSxwRPJ8fDgvYXd6SkaZ2TA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>

var socket = io('http://votacao.camarapatos.mg.gov.br/')
//var socket = io('http://localhost/')

        const fpPromise = import('https://fpjscdn.net/v3/phLmAbf5J9dCxQc5KZxY')
                    .then(FingerprintJS => FingerprintJS.load())

                // Get the visitor identifier when you need it.
                fpPromise
                    .then(fp => fp.get())
                    .then(result => {
                        // This is the visitor identifier:
                        const visitorId = result.visitorId
                        socket.emit('teste-fpjs', fpjs = {
                            id: $.cookie('id'),
                            visitor: visitorId
                        })
                    })

        $(document).on('click', 'button', function () {

            if ($(this).html() == 'SIM') {
                resposta = {
                    voto: true,
                    id: $.cookie('id')
                }
                $($('.card')[0]).animate({
                    padding: '10px'
                })
                $($('.card')[1]).animate({
                    padding: '30px'
                })
            } else {
                resposta = {
                    voto: false,
                    id: $.cookie('id')
                }
                $($('.card')[1]).animate({
                    padding: '10px'
                })
                $($('.card')[0]).animate({
                    padding: '30px'
                })
            }
            socket.emit('resposta-to-server', resposta)
        })

        socket.on('painel-to-client', painel => {
            if (painel.selecionado) {
                $("body").html("<div class='container text-start' style='height: 100%;width: 100%;padding: 0px;margin: 0px;min-width: 100%;max-width: 100%;min-height: 100%;max-height: 100%;display: grid;grid-template-rows: 10% 45% 45%;'> <h1 style='text-align:center;padding: 8px;background: linear-gradient(rgb(33,78,113) 45%, rgb(23,63,94) 51%);margin: 5px;border-radius: 5.6px;color: white;font-weight: bold;'>"+painel.pauta+"</h1> <div class='card' style='padding: 30px;border-width: 0px;border-left-width: 0px;'><button class='btn btn-primary text-center' type='button' style='width: 100%;background: var(--bs-success);padding: 0px;height: 100%;font-size: 50px;font-weight: bold;'>SIM</button> </div> <div class='card' style='padding: 30px;border-width: 0px;border-left-width: 0px;'><button class='btn btn-primary' type='button' style='width: 100%;height: 100%;background: var(--bs-red);font-weight: bold;font-size: 50px;'>NÃO</button> </div> </div> ")


            } else {
                $("body").html("<div class='container text-start' style='margin-top: 30% !important;height: 100%;width: 100%;padding: 0px;margin: 0px;min-width: 100%;max-width: 100%;min-height: 100%;max-height: 100%;display: block;grid-template-rows: 50% 50%;'> <h1 class='text-center'>O presidente ainda não colocou nada em pauta, aguarde.</h1> </div> ")
            }
        })

        

        function auth() {
            $.cookie('id') < 16 && $.cookie('id') >= 0 ? undefined : window.location.href = "/login.html"
        }

        socket.on('socket-id-to-client', socketToClient => {
            socket.emit('socket-id-to-server', socketIdToServer = {
                id: $.cookie('id'),
                socket: socketToClient
            })
        })

    </script>
</body>

</html>
