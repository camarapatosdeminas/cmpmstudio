    <script type="text/javascript">


        //var socket = io('http://localhost/')
        var socket = io('http://votacao.camarapatos.mg.gov.br/')




        // Initialize the agent at application startup.


        var users = [    
            '8769',
            '2310',
            '1720',
            '6091',
            '2177',
            '3958',
            '7025',
            '8601',
            '6272',
            '4473',
            '2944',
            '9483',
            '4178',
            '8771',
            '1219',
            '3533',
            'cpd2025',
            'cpd2025'
        ]


        $('.btn').click(function () {
            if ($('.form-control')[0].value === users[$('.form-select :selected').attr('value')]) {

                $.cookie(
                    'id',
                    ($('.form-select :selected').attr('value')).replace(/[^\d]/g, "")
                )

                socket.emit('online-to-server', cookieToServer = $.cookie('id'))

                if ($.cookie('id') == 16) {
                    window.location.href = "/pautas.html"
                } else if ($.cookie('id') == 17) {
                    window.location.href = "/painel.html"
                } else if ($.cookie('id') < 17 && $.cookie('id') >= 0) {
                    window.location.href = "/votacao.html"
                }

            } else {
                $('#senha-incorreta').html("Senha incorreta!")
            }
        })


        function auth() {



            if ($.cookie('id') == 16) {
                window.location.href = "/pautas.html"
            } else if ($.cookie('id') == 17) {
                window.location.href = "/painel.html"
            } else if ($.cookie('id') < 16 && $.cookie('id') >= 0) {
                window.location.href = "/votacao.html"
            }
        }
