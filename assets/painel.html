    <script>

        window.onbeforeunload = function (event) {
            event.returnValue = "Mensagem de aviso";
        }

        var socket = io('http://votacao.camarapatos.mg.gov.br/')
        //var socket = io('http://localhost/')


        $("#salvar").click(function () {
            socket.emit('salvar')
        })

        //add campo de vereador

        function adicionarVereador() {
            $('#all-vereadores').append("<div class='input-group mb-3' style='width: 100%;'> <div class='form-floating mt-0' style='width: 100%;'> <div class='input-group-text' style='height: 40px;border-top-left-radius: 5.6px;border-bottom-left-radius: 0px;border-bottom-right-radius: 0px;border-top-right-radius: 5.6px;'><input type='checkbox' class='form-check-input mt-0' aria-label='Checkbox for following text input' value='' style='margin-right: 12px;padding: 12px;'><input class='form-control form-control' type='text' id='theID' name='vereador' placeholder='Vereador' style='width: 300%;height: 40px;border-radius: 0px;'><input class='form-control form-control' type='text' id='theID-1' placeholder='Sigla' style='width: 100%;height: 40px;border-radius: 0px;'><i class='icon ion-android-delete' style='font-size: 28px;margin-left: 12px;'></i></div> </div><input class='form-control form-control' type='text' id='theID-37' placeholder='e-mail' style='width: 300%;height: 40px;border-radius: 0px;border-bottom-left-radius: 5.6px;border-bottom-right-radius: 5.6px;'> </div>")
        }

        $('#add-vereador').click(function () {
            adicionarVereador()
        })

        $(document).on('click', '#all-vereadores .icon', function () {
            $(this).parent().parent().parent().remove()
        })

        $('#add-pauta').click(function () {
            $('#all-pautas').append("<form style='margin-top:10px;background: rgb(234, 236, 244);border-top-right-radius: 5.6px;border-bottom-right-radius: 5.6px;border-top-left-radius: 10px;border-bottom-left-radius: 10px;padding: 6px;border-width: 1px;border-color: rgb(209,211,226);border-top: 1px solid rgb(209,211,226) ;border-right: 1px solid rgb(209,211,226) ;border-bottom: 1px solid rgb(209,211,226) ;border-left: 1px solid rgb(209,211,226) ;'>  <div class='input-group-text' style='height: 40px;border-top-left-radius: 10px;border-bottom-left-radius: 10px;'> <input type='checkbox' checked class='form-check-input mt-0' aria-label='Checkbox for following text input' value='' style='margin-right: 12px;padding: 12px;'><input disabled='true' class='form-control form-control' type='text' id='' placeholder='Vereador Presidente vota?' style='width: 300%;height: 40px;border-radius: 0px;'> </div>   <div class='mb-3'><label class='form-label' for='address'><strong>Descrição</strong><br></label><input class='form-control' type='text' id='address' placeholder='' name='address'></div> <div class='row'> <div class='col'> <div class='mb-3'><label class='form-label' for='city'><strong>Pauta</strong></label><input class='form-control' type='text' id='city' placeholder='' name='city'></div> </div> <div class='col'> <div class='mb-3'><label class='form-label' for='country'><strong>Autor</strong></label><input class='form-control' type='text' id='country' placeholder='' name='country'></div> </div> </div><button class='btn btn-primary' type='button' style='width: 100%;background: var(--bs-gray-800);border-top-color: var(--bs-body-color);border-right-color: var(--bs-body-color);border-bottom-color: var(--bs-body-color);border-left-color: var(--bs-body-color);'>Apagar</button> <div class='mb-3'></div> </form>")
        })

        $(document).on('click', '#all-pautas .btn', function () {
            $(this).parent().remove()
        })

        function adicionarOrador() {
            $('#all-oradores').append("<div class='input-group mb-3' style='width: 100%;'> <div class='form-floating mt-0' style='width: 100%;'> <div class='input-group-text' style='height: 40px;border-top-left-radius: 5.6px;border-bottom-left-radius: 0px;border-bottom-right-radius: 0px;border-top-right-radius: 5.6px;'><input type='checkbox' class='form-check-input mt-0' aria-label='Checkbox for following text input' value='' style='margin-right: 12px;padding: 12px;'><input class='form-control form-control' type='text' placeholder='Nome' style='width: 300%;height: 40px;border-radius: 0px;'><input class='form-control form-control' type='text' placeholder='Orgão/Classificação' style='width: 100%;height: 40px;border-radius: 0px;'><i class='icon ion-android-delete' style='font-size: 28px;margin-left: 12px;'></i></div> </div><input class='form-control form-control' type='text' placeholder='Função' style='width: 300%;height: 40px;border-radius: 0px;border-bottom-left-radius: 5.6px;border-bottom-right-radius: 5.6px;'> </div>")
        }

        function adicionarSubtitulo() {
            $('#all-subtitulos').append("<div class='input-group mb-3' style='width: 100%;'> <div class='form-floating mt-0' style='width: 100%;'> <div class='input-group-text' style='height: 40px;border-top-left-radius: 10px;border-bottom-left-radius: 10px;background: rgb(234, 236, 244);'><input type='checkbox' class='form-check-input mt-0' aria-label='Checkbox for following text input' value='' style='margin-right: 12px;padding: 12px;'><input class='form-control form-control' type='text' placeholder='Subtítulo' style='width: 100%;height: 40px;border-radius: 0px;'><i class='icon ion-android-delete' style='font-size: 28px;margin-left: 12px;'></i></div> </div> </div>")
        }

        $(document).on('click', '#add-subtitulo', function () {
            adicionarSubtitulo()
        })

        $(document).on('click', '#add-orador', () => {
            adicionarOrador()
        })


        $(document).on('click', '#all-oradores .icon', function () {
            $(this).parent().parent().parent().remove()
        })

        $(document).on('click', '#all-vereadores .form-check-input', function () {
            var vereador = {
                nome: $(this).parent().parent().parent().find('.form-control')[0].value,
                sigla: $(this).parent().parent().parent().find('.form-control')[1].value,
                email: $(this).parent().parent().parent().find('.form-control')[2].value,
                selecionado: $(this).is(':checked')
            }

            socket.emit('vereador', vereador)
        })

        $(document).on('click', '.form-check-input', function () {
            if ($(this).attr('id') != 'checkbox-cronometro' && $(this).attr('id') != 'checkbox-subtitulo') {
                $(document).find('.ion-person-add').parent().parent().parent().parent().find('.form-check-input').not(this).prop('checked', false)
            }

        })

        $('#checkbox-cronometro').click(function () {
            var cronometro = {
                tempo: $(this).parent().find('.form-control').val(),
                ativado: $(this).is(':checked')
            }
            socket.emit('cronometro-to-server', cronometro)
            console.log(cronometro.ativado)
        })

        $('#salvar').click(function () {
            var pautasToServer = []

            for (var i = 0; i < $('#all-pautas').find('form').length; i++) {
                pautasToServer.push({
                    descricao: $($('#all-pautas').find('form')[i]).find('.form-control')[1].value,
                    pauta: $($('#all-pautas').find('form')[i]).find('.form-control')[2].value,
                    autor: $($('#all-pautas').find('form')[i]).find('.form-control')[3].value,
                    presidenteVota: $($($('#all-pautas').find('form')[i]).find('.form-check-input.mt-0')[0]).is(':checked')
                })
            }

            socket.emit('pautas-to-server', pautasToServer)
        })

        $(document).on('click', '#all-subtitulos .icon', function () {
            $(this).parent().parent().parent().remove()
        })

        socket.on('input-vereadores', vereadores => {

            for (var i = 0; i < vereadores.length; i++) {
                adicionarVereador()
            }

            for (var i = 0; i < vereadores.length; i++) {

                $($('#all-vereadores .input-group')[i]).find('.form-control')[0].value = vereadores[i].nome
                $($('#all-vereadores .input-group')[i]).find('.form-control')[1].value = vereadores[i].sigla
                $($('#all-vereadores .input-group')[i]).find('.form-control')[2].value = vereadores[i].email
            }
        })

        $(document).on('click', '.form-check-input', () => {
            formChecks = $(document).find('.form-check-input')
            estadoChecks = []
            for (var i = 0; i < formChecks.length; i++) {
                estadoChecks.push($(formChecks[i]).is(':checked'))
            }
            socket.emit('check-to-server', estadoChecks)
        })

        socket.on('check-to-client', estadoCheck => {
            for (var i = 0; i < estadoCheck.length; i++) {
                $($(document).find('.form-check-input')[i]).prop('checked', estadoCheck[i])
            }
        })



        $(document).on('click', '#reuniao-div .form-check-input', function () {
            $('#reuniao-div .form-check-input').not(this).prop('checked', 0)
        })

        $(document).on('input click', '#all-oradores', function () {
            inputsOradores = []
            for (var i = 0; i < $('#all-oradores .input-group').length; i++) {
                inputsOradores.push({
                    nome: $($('#all-oradores .input-group')[i]).find('.form-control')[0].value,
                    funcao: $($('#all-oradores .input-group')[i]).find('.form-control')[1].value,
                    orgao: $($('#all-oradores .input-group')[i]).find('.form-control')[2].value,
                    selecionado: $(this).is(':checked')
                })
            }
            socket.emit('oradores-to-server', inputsOradores)
        })

        socket.on('oradores-to-client', inputsOradoresServer => {
            for (var i = 0; i < inputsOradoresServer.length; i++) {
                adicionarOrador()
                $($('#all-oradores .input-group')[i]).find('.form-control')[0].value = inputsOradoresServer[i].nome
                $($('#all-oradores .input-group')[i]).find('.form-control')[1].value = inputsOradoresServer[i].funcao
                $($('#all-oradores .input-group')[i]).find('.form-control')[2].value = inputsOradoresServer[i].orgao
            }
        })

        $(document).on('click', '#all-oradores .form-check-input', function () {
            var orador = {
                nome: $(this).parent().parent().parent().find('.form-control')[0].value,
                funcao: $(this).parent().parent().parent().find('.form-control')[1].value,
                orgao: $(this).parent().parent().parent().find('.form-control')[2].value,
                selecionado: $(this).is(':checked')
            }

            socket.emit('orador-to-server', orador)
        })

        $(document).on('input', '#titulo-reuniao', function () {
            titulo = this.value
            socket.emit('titulo-to-server', titulo)
        })

        $(document).on('click', '#reuniao-div .form-check-input', function () {
            subtitulo = {
                valor: $(this).parent().find('.form-control').val(),
                estado: $(this).prop('checked')
            }
            socket.emit('subtitulo-to-server', subtitulo)
        })

        

        socket.on('reuniao-inputs-to-client', reuniaoInputsServer => {
            for (var i = 0; i < reuniaoInputsServer.length; i++) {
                if (i < reuniaoInputsServer.length - 1) {
                    adicionarSubtitulo()
                }
                $('#reuniao-div .form-control')[i].value = reuniaoInputsServer[i]
            }
        })

        $(document).on('click', '#exit', () => {
            $.removeCookie('id')
            window.location.href = "/login.html"
        })

        function auth() {
            if ($.cookie('id') != 17) {
                window.location.href = "/login.html"
            }
        }

        socket.on('pautas-to-client', pautasToClient =>{
            for (var i = 0; i < pautasToClient.length; i++) {
                $('#all-pautas').append("<form style='margin-top:10px;background: rgb(234, 236, 244);border-top-right-radius: 5.6px;border-bottom-right-radius: 5.6px;border-top-left-radius: 10px;border-bottom-left-radius: 10px;padding: 6px;border-width: 1px;border-color: rgb(209,211,226);border-top: 1px solid rgb(209,211,226) ;border-right: 1px solid rgb(209,211,226) ;border-bottom: 1px solid rgb(209,211,226) ;border-left: 1px solid rgb(209,211,226) ;'>  <div class='input-group-text' style='height: 40px;border-top-left-radius: 10px;border-bottom-left-radius: 10px;'> <input type='checkbox' checked class='form-check-input mt-0' aria-label='Checkbox for following text input' value='' style='margin-right: 12px;padding: 12px;'><input disabled='true' class='form-control form-control' type='text' id='' placeholder='Vereador Presidente vota?' style='width: 300%;height: 40px;border-radius: 0px;'> </div>   <div class='mb-3'><label class='form-label' for='address'><strong>Descrição</strong><br></label><input class='form-control' type='text' id='address' placeholder='' name='address'></div> <div class='row'> <div class='col'> <div class='mb-3'><label class='form-label' for='city'><strong>Pauta</strong></label><input class='form-control' type='text' id='city' placeholder='' name='city'></div> </div> <div class='col'> <div class='mb-3'><label class='form-label' for='country'><strong>Autor</strong></label><input class='form-control' type='text' id='country' placeholder='' name='country'></div> </div> </div><button class='btn btn-primary' type='button' style='width: 100%;background: var(--bs-gray-800);border-top-color: var(--bs-body-color);border-right-color: var(--bs-body-color);border-bottom-color: var(--bs-body-color);border-left-color: var(--bs-body-color);'>Apagar</button> <div class='mb-3'></div> </form>")
            }

            for (var i = 0; i < pautasToClient.length; i++) {
                $('#all-pautas #address.form-control')[i].value = pautasToClient[i].descricao
                $('#all-pautas #city.form-control')[i].value = pautasToClient[i].pauta
                $('#all-pautas #country.form-control')[i].value = pautasToClient[i].autor
            }
        })

        $(document).on('input click', '#reuniao-div', function () {
            reuniaoInputs = []
            for (var i = 0; i < $(this).find('.form-control').length; i++) {
                reuniaoInputs.push($(this).find('.form-control')[i].value)
            }
            socket.emit('reuniao-inputs-to-server', reuniaoInputs)
        })

    </script>
</body>

</html>
